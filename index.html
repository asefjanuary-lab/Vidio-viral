<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Halaman video">
  <title>Video Terbaru</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #1f2937);
      color: #fff;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 32px 24px;
      text-align: center;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 22px;
      box-shadow: 0 15px 50px rgba(0,0,0,.35);
      backdrop-filter: blur(10px);
    }
    .icon { font-size: 58px; margin-bottom: 10px; }
    h1 { margin: 0 0 10px; font-size: 28px; }
    p {
      margin: 0 auto 24px;
      color: #d1d5db;
      line-height: 1.6;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 16px 20px;
      border-radius: 12px;
      background: #22c55e;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 18px;
      transition: .2s;
    }
    .btn:hover { background: #16a34a; transform: translateY(-1px); }
    .note { margin-top: 18px; font-size: 12px; color: #9ca3af; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">🎬</div>
    <h1>Video Terbaru</h1>
    <p>Klik tombol di bawah untuk melanjutkan dan melihat videonya.</p>

    <a class="btn"
       href="https://www.effectivecpmnetwork.com/y7dd20mqrm?key=3a86a9b92a7f907521431d6376bab3b3"
       target="_blank"
       rel="noopener noreferrer">
      ▶️ TONTON SEKARANG
    </a>

    <div class="note">Halaman ini dioptimalkan untuk perangkat HP.</div>
  </main>
</body>
</html>
